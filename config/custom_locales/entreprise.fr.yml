# pf: surcharge de terminologie de l'identifiant d'entreprise.
#
# Ce répertoire est chargé APRÈS config/locales/** (cf. config/application.rb),
# et I18n fait un deep-merge où le dernier chargé gagne. Conséquence : les
# fichiers de locales upstream ne sont plus patchés, un merge qui les réécrit
# passe sans conflit, et notre terminologie gagne quand même.
#
# Terme canonique : « numéro Tahiti ou SIRET » — Tahiti en capitale initiale,
# SIRET en capitales. Ne pas dévier de cette casse.
#
# Toute clé ajoutée ici doit exister dans config/locales, sinon la surcharge ne
# s'applique pas : spec/i18n/terminologie_entreprise_spec.rb le vérifie.
---
fr:
  activerecord:
    attributes:
      # Bloc d'identité d'entreprise (Dossiers::IdentiteEntrepriseComponent,
      # via Etablissement.human_attribute_name)
      siret: "Numéro Tahiti ou SIRET"
      siret_siege_social: "Numéro Tahiti ou SIRET du siège social"
      user:
        siret: "Numéro Tahiti ou SIRET"
      service:
        siret: "Numéro Tahiti ou SIRET"
      champs/siret_champ:
        hints:
          # pf: le garde anti-ambiguïté ne s'applique qu'à la frappe en cours —
          # une valeur complète reçoit bien son tiret, y compris purement
          # numérique (formatIdentifiantEntreprise('002253001') => '002253-001',
          # cf. app/javascript/shared/identifiant-entreprise.test.ts).
          value: "Numéro Tahiti à 6 ou 9 caractères (ex. G33972-001 ou 002253-001) ou numéro SIRET à 14 chiffres (ex. 418 166 096 00051)."
    errors:
      models:
        champs/siret_champ:
          attributes:
            external_id:
              length: "doit être un numéro Tahiti (6 à 9 caractères) ou un numéro SIRET (14 chiffres)"
        # pf: erreurs du formulaire service (cf. config/locales/models/service/fr.yml).
        # not_prefillable existait dans la surcharge initiale mais aucun code
        # n'ajoute jamais cette erreur (IdentifiantEntrepriseValidator ne
        # produit que :checksum/:length) — retirée, cf. siret_not_found.
        service:
          attributes:
            siret:
              # pf: le gabarit i18n_customize_full_message (config/application.rb)
              # préfixe déjà "Le numéro Tahiti ou SIRET " devant length/checksum —
              # ne pas répéter le terme dans ces deux messages.
              format: "Le numéro Tahiti ou SIRET %{message}"
              length: "doit comporter 6 à 9 caractères (Tahiti) ou 14 chiffres (SIRET)"
  activemodel:
    models:
      siret: "Numéro Tahiti ou SIRET"
    errors:
      models:
        siret:
          attributes:
            siret:
              length: "est invalide. Attendu : un numéro Tahiti (6 à 9 caractères, commençant par une lettre ou un chiffre) ou un numéro SIRET à 14 chiffres"
  errors:
    messages:
      invalid_siret_length: "Le numéro doit être un numéro Tahiti (6 à 9 caractères) ou un numéro SIRET (14 chiffres)."
  views:
    # pf: formulaire d'identification (siret.html.haml) — les deux référentiels
    # sont présentés à égalité, avec leurs deux annuaires respectifs.
    users:
      dossiers:
        identite:
          complete_siret: "Renseignez le numéro d’identification de votre entreprise, administration ou association pour commencer la démarche."
          siret_placeholder: "numéro Tahiti ou SIRET"
          siret_help_html: "Polynésie française : numéro Tahiti à 6 ou 9 caractères, à retrouver sur %{annuaire_link} ou auprès de votre service comptable."
          annuaire_link_title: "Rechercher un numéro Tahiti sur l’annuaire des entreprises de Polynésie française"
    # pf: bouton « Modifier le numéro » sur la page dossier (usager + instructeur)
    shared:
      dossiers:
        demande:
          edit_siret: "Modifier le numéro Tahiti ou SIRET"
    prefill_descriptions:
      edit:
        possible_values:
          siret_html: "Un numéro Tahiti ou SIRET"
  # pf: alerte administrateur "service sans numéro" (fond de page procédures)
  shared:
    procedures:
      no_siret: "Vous n’avez pas renseigné le numéro Tahiti ou SIRET du service pour certaines de vos démarches. Merci de les modifier."
      add_siret_to_service_without_siret_html: "Ajouter le numéro Tahiti ou SIRET du service <a href=\"%{link}\">%{nom}</a>"
  views:
    shared:
      dossiers:
        identite_entreprise:
          # pf: ce message n'etait jamais rendu tant que la branche usager du
          # partial etait inoperante. Il nommait « SIRET » un numero qui peut
          # etre un numero Tahiti ; le numero seul suffit a identifier.
          warning_for_private_info: "L’établissement %{siret} a exercé son droit à la non publication des informations relatives à son identité. Les informations ne seront donc visibles que de la part des services instructeurs."
