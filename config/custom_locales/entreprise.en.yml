en:
  activerecord:
    attributes:
      siret: "Tahiti number or SIRET"
      siret_siege_social: "Head office Tahiti number or SIRET"
      user:
        siret: "Tahiti number or SIRET"
      service:
        siret: "Tahiti number or SIRET"
    errors:
